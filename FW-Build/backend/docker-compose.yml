version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/3d-models
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    networks:
      - app-network

  mongodb:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: 